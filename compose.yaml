services:
  book-writer:
    build:
      context: .
      additional_contexts:
        - loki-engine=../loki-engine
    image: book-writer
    restart: unless-stopped
    ports:
      # Localhost only: the app has no login, and anyone who can reach it can spend the server's API key.
      - "127.0.0.1:${PORT:-8090}:8080"
    environment:
      # Passed through only when set on the host or in .env
      - DEEPSEEK_API_KEY
      - OPENAI_API_KEY
      - LLM_MAX_CONCURRENCY
      - LM_STUDIO_BASE_URL=${LM_STUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - book-writer-output:/app/output

volumes:
  book-writer-output:
